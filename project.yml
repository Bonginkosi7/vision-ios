name: VisionIOS
options:
  bundleIdPrefix: com.vision
packages:
  VisionCore:
    path: .
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "6.0.0"
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: "0.9.0"
  LlamaBinary:
    path: Packages/LlamaBinary
targets:
  VisionIOS:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: App
    dependencies:
      - package: VisionCore
      - package: GRDB
        product: GRDB
      - package: ZIPFoundation
        product: ZIPFoundation
      - package: LlamaBinary
        product: llama
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vision.browser
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        # The app icon is the official VISION mark (white V on near-black), in
        # Assets.xcassets/AppIcon.appiconset.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Firebase config, baked into the build at build time — the same
        # real "injected once per build" model vision-android uses via
        # Gradle's buildConfigField and desktop now uses via esbuild's
        # `define` (see FirebaseConfig.swift's own doc comment). Xcode's
        # `$(VAR)` build-setting substitution reads these straight from the
        # real CI/shell environment; empty string if unset, so a local dev
        # build without them set still builds, just unconfigured
        # (FirebaseConfig.isConfigured() reads false), exactly like
        # Android's/desktop's own unconfigured state.
        VISION_FIREBASE_API_KEY: "$(VISION_FIREBASE_API_KEY)"
        VISION_FIREBASE_PROJECT_ID: "$(VISION_FIREBASE_PROJECT_ID)"
        # Same real mechanism for the analytics backend's own two values —
        # no vision-analytics-backend has been deployed yet (see README),
        # so these are empty right now and AnalyticsConfig.isConfigured()
        # reads false, same honest unconfigured state Android/desktop are
        # already in; the wiring is real and ready for when it exists.
        VISION_AI_PROXY_URL: "$(VISION_AI_PROXY_URL)"
        VISION_AI_PROXY_KEY: "$(VISION_AI_PROXY_KEY)"
        VISION_ANALYTICS_URL: "$(VISION_ANALYTICS_URL)"
        VISION_ANALYTICS_WRITE_KEY: "$(VISION_ANALYTICS_WRITE_KEY)"
        # INFOPLIST_KEY_* (not a separate XcodeGen `info.properties` block —
        # that requires its own on-disk Info.plist `path`, which conflicts
        # with GENERATE_INFOPLIST_FILE's auto-generated one above) is how
        # this same file already injects a key into that auto-generated
        # plist, e.g. INFOPLIST_KEY_UILaunchScreen_Generation above.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "VISION uses the microphone so you can dictate your questions to Ask VISION."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "VISION turns your speech into text so you can dictate questions to Ask VISION."
        INFOPLIST_KEY_VisionFirebaseAPIKey: "$(VISION_FIREBASE_API_KEY)"
        INFOPLIST_KEY_VisionFirebaseProjectID: "$(VISION_FIREBASE_PROJECT_ID)"
        INFOPLIST_KEY_VisionAIProxyURL: "$(VISION_AI_PROXY_URL)"
        INFOPLIST_KEY_VisionAIProxyKey: "$(VISION_AI_PROXY_KEY)"
        INFOPLIST_KEY_VisionAnalyticsURL: "$(VISION_ANALYTICS_URL)"
        INFOPLIST_KEY_VisionAnalyticsWriteKey: "$(VISION_ANALYTICS_WRITE_KEY)"

  # Real behavioral verification — launches the actual built app in a
  # booted simulator and drives it (navigate, bookmark, relaunch, confirm
  # persistence), closing the gap a plain `xcodebuild build` can't:
  # compiling proves the code is valid, not that it behaves correctly.
  VisionIOSUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: UITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: VisionIOS

schemes:
  VisionIOS:
    build:
      targets:
        VisionIOS: all
        VisionIOSUITests: [test]
    test:
      targets:
        - VisionIOSUITests
    run:
      config: Debug
