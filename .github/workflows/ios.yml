name: iOS CI

# Real verification for vision-ios, run on GitHub's macOS runners (which
# ship with real, full Xcode) — the local dev machine only has Command Line
# Tools, so this workflow is the first place any of this code actually
# gets compiled against the real iOS SDK. See README.md for the local
# verification that *was* possible (VisionCore, verified via a standalone
# swiftc harness) and what could not be (everything in App/, until this
# runs green).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  visioncore-tests:
    name: VisionCore unit tests (real swift test, not the standalone harness)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: |
          xcode-select -p
          xcodebuild -version
          swift --version
      - name: swift test
        run: swift test --verbose

  ios-app-build:
    name: Build the full iOS app for the Simulator
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest available Xcode
        # XcodeGen generates a project in whatever format its own version
        # supports, which can be newer than this runner's *default* Xcode
        # (a real failure hit here: "future Xcode project file format (77)"
        # against the default Xcode 15.4) — explicitly picking the newest
        # installed Xcode avoids that mismatch instead of guessing a fixed
        # version number that will drift as GitHub updates its images.
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          echo "Selecting: $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
      - name: Show toolchain
        run: |
          xcode-select -p
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project from project.yml
        run: xcodegen generate
      - name: Pick an available iPhone simulator
        id: sim
        run: |
          # Real bug caught here on the first CI run: a `simctl list`
          # device line has two parenthetical groups — the UDID, then the
          # boot state, e.g. "iPhone 15 Pro (E3BB...) (Shutdown)" — and a
          # greedy `s/^ *(.*) \(.*/\1/` captured the UDID along with the
          # name instead of stopping at the first "(". Fixed by trimming
          # from the first " (" onward instead.
          DEVICE=$(xcrun simctl list devices available \
            | grep -m1 -E "iPhone (1[4-9]|[2-9][0-9])" \
            | sed -E 's/^ *//; s/ \(.*//')
          echo "Picked simulator: $DEVICE"
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"
      - name: Resolve Swift Package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project VisionIOS.xcodeproj \
            -scheme VisionIOS
      - name: Build for iOS Simulator
        run: |
          xcodebuild build \
            -project VisionIOS.xcodeproj \
            -scheme VisionIOS \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.device }}"
