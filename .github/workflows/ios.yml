name: iOS CI

# Real verification for vision-ios, run on GitHub's macOS runners (which
# ship with real, full Xcode) — the local dev machine only has Command Line
# Tools, so this workflow is the only place any of this code gets compiled
# against the real iOS SDK, and (via the UITests job) the only place it's
# actually launched and driven in a booted simulator. A green `xcodebuild
# build` alone only proves the code is valid, not that it behaves
# correctly — the UITests job closes that gap for real. See README.md.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  visioncore-tests:
    name: VisionCore unit tests (real swift test, not the standalone harness)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: |
          xcode-select -p
          xcodebuild -version
          swift --version
      - name: swift test
        run: swift test --verbose

  ios-app-uitests:
    name: Build + real UI tests in a booted Simulator
    runs-on: macos-14
    # Real Firebase values, baked into the build the same way
    # vision-android's CI passes them to Gradle and desktop's CI passes
    # them to esbuild — set here so xcodebuild's own `$(VAR)` build-setting
    # substitution (project.yml) picks them up when it processes Info.plist
    # during the build step below. Unset in any fork/PR run without repo
    # secrets, which still builds, just unconfigured — same as a local dev
    # build (see project.yml's own comment on this).
    env:
      VISION_FIREBASE_API_KEY: ${{ secrets.VISION_FIREBASE_API_KEY }}
      VISION_FIREBASE_PROJECT_ID: ${{ secrets.VISION_FIREBASE_PROJECT_ID }}
      # No vision-analytics-backend is deployed yet, so these two secrets
      # don't exist on this repo either — resolves to empty, same honest
      # unconfigured build as everywhere else, ready for when it does.
      VISION_ANALYTICS_URL: ${{ secrets.VISION_ANALYTICS_URL }}
      VISION_ANALYTICS_WRITE_KEY: ${{ secrets.VISION_ANALYTICS_WRITE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest available Xcode
        # XcodeGen generates a project in whatever format its own version
        # supports, which can be newer than this runner's *default* Xcode
        # (a real failure hit here: "future Xcode project file format (77)"
        # against the default Xcode 15.4) — explicitly picking the newest
        # installed Xcode avoids that mismatch instead of guessing a fixed
        # version number that will drift as GitHub updates its images.
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          echo "Selecting: $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
      - name: Show toolchain
        run: |
          xcode-select -p
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project from project.yml
        run: xcodegen generate
      - name: Pick an available iPhone simulator
        id: sim
        run: |
          # Two real bugs caught here across the first two CI runs:
          # (1) a greedy sed capture picked up the device's UDID along with
          #     its name (two parenthetical groups on one `simctl` line —
          #     UDID, then boot state) — fixed by trimming at the first "(".
          # (2) even with the name fixed, `name:X,OS:latest` still failed —
          #     this runner's "latest" simulator runtime isn't necessarily
          #     paired with every device silhouette (e.g. "iPhone 15 Pro"
          #     had no OS:latest entry, only specific older ones). Targeting
          #     one exact, confirmed-available simulator by UDID instead of
          #     name+OS sidesteps the pairing question entirely.
          LINE=$(xcrun simctl list devices available | grep -E "iPhone (1[4-9]|[2-9][0-9])" | tail -1)
          echo "Matched device line: $LINE"
          UDID=$(echo "$LINE" | grep -oE '[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}')
          echo "Picked UDID: $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Resolve Swift Package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project VisionIOS.xcodeproj \
            -scheme VisionIOS
      - name: Boot the simulator
        run: |
          xcrun simctl boot "${{ steps.sim.outputs.udid }}" || true
          xcrun simctl bootstatus "${{ steps.sim.outputs.udid }}" -b
      - name: Build and run real UI tests in the Simulator
        # This is the actual behavioral proof, not just a compile check —
        # the app is installed on a real booted simulator and driven:
        # types a real URL, waits for real WKWebView navigation to
        # complete, taps the bookmark star, force-terminates the process,
        # relaunches, and confirms the bookmark survived (VisionIOSUITests
        # in UITests/).
        run: |
          xcodebuild test \
            -project VisionIOS.xcodeproj \
            -scheme VisionIOS \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult
      - name: Upload test result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: TestResults.xcresult
          retention-days: 14
