name: iOS CI

# Real verification for vision-ios, run on GitHub's macOS runners (which
# ship with real, full Xcode) — the local dev machine only has Command Line
# Tools, so this workflow is the first place any of this code actually
# gets compiled against the real iOS SDK. See README.md for the local
# verification that *was* possible (VisionCore, verified via a standalone
# swiftc harness) and what could not be (everything in App/, until this
# runs green).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  visioncore-tests:
    name: VisionCore unit tests (real swift test, not the standalone harness)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: |
          xcode-select -p
          xcodebuild -version
          swift --version
      - name: swift test
        run: swift test --verbose

  ios-app-build:
    name: Build the full iOS app for the Simulator
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: |
          xcode-select -p
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project from project.yml
        run: xcodegen generate
      - name: Pick an available iPhone simulator
        id: sim
        run: |
          DEVICE=$(xcrun simctl list devices available \
            | grep -m1 -E "iPhone (1[4-9]|[2-9][0-9])" \
            | sed -E 's/^ *(.*) \(.*/\1/')
          echo "Picked simulator: $DEVICE"
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"
      - name: Resolve Swift Package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project VisionIOS.xcodeproj \
            -scheme VisionIOS
      - name: Build for iOS Simulator
        run: |
          xcodebuild build \
            -project VisionIOS.xcodeproj \
            -scheme VisionIOS \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.device }}"
