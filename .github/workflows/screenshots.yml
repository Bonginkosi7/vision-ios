name: iOS screenshots

# Drives the real app on a 6.9-inch iPhone simulator and saves App Store screenshots (1320 x 2868) to a
# private draft release (GitHub's artifact storage is limited). Uses the real AI service for one question.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest Xcode
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Write the app settings (kept out of git)
        env:
          AI_URL: ${{ secrets.VISION_AI_PROXY_URL }}
          AI_KEY: ${{ secrets.VISION_AI_PROXY_KEY }}
          ANALYTICS_URL: ${{ secrets.VISION_ANALYTICS_URL }}
          ANALYTICS_KEY: ${{ secrets.VISION_ANALYTICS_WRITE_KEY }}
          LICENCE_KEY: ${{ secrets.VISION_LICENCE_PUBLIC_KEY }}
          FIREBASE_KEY: ${{ secrets.VISION_FIREBASE_API_KEY }}
          FIREBASE_PROJECT: ${{ secrets.VISION_FIREBASE_PROJECT_ID }}
        run: |
          xc() { printf '%s' "$1" | sed 's#//#/$()/#'; }
          {
            echo "VISION_AI_PROXY_URL = $(xc "$AI_URL")"
            echo "VISION_AI_PROXY_KEY = $AI_KEY"
            # No analytics from screenshot runs: leave these empty so the demo data never reaches the dashboard.
            echo "VISION_ANALYTICS_URL ="
            echo "VISION_ANALYTICS_WRITE_KEY ="
            echo "VISION_LICENCE_PUBLIC_KEY = $LICENCE_KEY"
            echo "VISION_FIREBASE_API_KEY = $FIREBASE_KEY"
            echo "VISION_FIREBASE_PROJECT_ID = $FIREBASE_PROJECT"
          } > Config/Local.xcconfig

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Pick a 6.9-inch iPhone simulator
        id: sim
        run: |
          LINE=$(xcrun simctl list devices available | grep -E "iPhone (1[6-9]|[2-9][0-9]) Pro Max" | tail -1)
          echo "Matched device line: $LINE"
          UDID=$(echo "$LINE" | grep -oE '[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}')
          if [ -z "$UDID" ]; then echo "::error::No Pro Max simulator available"; xcrun simctl list devices available; exit 1; fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Boot it with a tidy status bar
        run: |
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
          xcrun simctl boot "${{ steps.sim.outputs.udid }}" || true
          xcrun simctl bootstatus "${{ steps.sim.outputs.udid }}" -b
          xcrun simctl ui "${{ steps.sim.outputs.udid }}" appearance light
          xcrun simctl status_bar "${{ steps.sim.outputs.udid }}" override --time 9:41 --batteryState charged --batteryLevel 100 --cellularMode active --cellularBars 4 --wifiBars 3

      - name: Take the screenshots
        shell: bash
        run: |
          xcodebuild test \
            -project VisionIOS.xcodeproj -scheme VisionIOS \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -only-testing:VisionIOSUITests/ScreenshotTests \
            -resultBundlePath Screenshots.xcresult

      - name: Collect the pictures
        if: always()
        shell: bash
        run: |
          xcrun xcresulttool export attachments --path Screenshots.xcresult --output-path raw
          mkdir -p out
          python3 - <<'PY'
          import json, os, re, shutil
          manifest = json.load(open("raw/manifest.json"))
          for test in manifest:
              for a in test.get("attachments", []):
                  name = re.match(r"(\d\d-[a-z-]+)", a.get("suggestedHumanReadableName", ""))
                  if name:
                      shutil.copy(os.path.join("raw", a["exportedFileName"]), os.path.join("out", name.group(1) + ".png"))
          PY
          ls -l out
          for f in out/*.png; do echo "$f $(sips -g pixelWidth -g pixelHeight "$f" | awk '/pixel/ {printf $2 " "}')"; done

      - name: Keep them in a private draft release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "screenshots-${{ github.run_number }}" out/*.png --draft --title "App Store screenshots (run ${{ github.run_number }})" --notes "Generated by the iOS screenshots workflow."

      - name: Remove the settings file
        if: always()
        run: rm -f Config/Local.xcconfig
